<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Quickstart Guide | Greg Sain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #1a1a1a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        
        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: #00FF41;
            text-decoration: none;
        }
        
        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #00FF41;
        }
        
        .iframe-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="logo">GREG SAIN</a>
            <a href="/" class="back-link">← Back to Home</a>
        </div>
        <div class="iframe-container">
            <iframe src="https://designrr.page?id=648495&token=4093622671&h=5670" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
