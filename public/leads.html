<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads Dashboard | Greg Sain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #00FF41;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        
        .login-form {
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            margin: 100px auto;
        }
        
        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-form input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        .login-form button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00FF41 0%, #00cc33 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #00FF41;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
        
        .leads-table {
            width: 100%;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .leads-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .leads-table th {
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #00FF41;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }
        
        .leads-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }
        
        .leads-table tr:hover {
            background: rgba(0, 255, 65, 0.05);
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(0, 255, 65, 0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #00FF41;
        }
        
        .badge.free-build {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
        }
        
        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .delete-btn:hover {
            background: rgba(255, 68, 68, 0.2);
        }
        
        .hidden {
            display: none;
        }
        
        .refresh-btn {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid rgba(0, 255, 65, 0.3);
            color: #00FF41;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            background: rgba(0, 255, 65, 0.2);
        }
        
        .error {
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
        
        .clickable-name {
            color: #00FF41;
            cursor: pointer;
            text-decoration: underline;
        }
        
        .clickable-name:hover {
            color: #00cc33;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: rgba(26, 26, 26, 0.95);
            border: 2px solid rgba(0, 255, 65, 0.3);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
        }
        
        .modal-header h2 {
            color: #00FF41;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: auto;
        }
        
        .close-btn:hover {
            color: #fff;
        }
        
        .detail-row {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .detail-label {
            color: #00FF41;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="login-section" class="login-form">
            <h2>🔒 Leads Dashboard</h2>
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="login()">Access Dashboard</button>
        </div>
        
        <!-- Leads Dashboard -->
        <div id="dashboard-section" class="hidden">
            <h1>Leads Dashboard</h1>
            <p class="subtitle">View all ebook downloads and free build applications</p>
            
            <button class="refresh-btn" onclick="loadLeads(true)">🔄 Refresh</button>
        <button class="refresh-btn" onclick="toggleArchiveView()" id="archive-toggle-btn" style="margin-left: 10px; background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.3); color: #FFD700;">📁 View Archived</button>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-leads">0</div>
                    <div class="stat-label">Total Leads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="ebook-leads">0</div>
                    <div class="stat-label">Ebook Downloads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="free-build-leads">0</div>
                    <div class="stat-label">Free Build Apps</div>
                </div>
            </div>
            
            <div class="leads-table" id="active-leads-section">
                <h3 style="padding: 15px; color: #00FF41; border-bottom: 1px solid rgba(0, 255, 65, 0.2);">Active Leads</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Company</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <div class="leads-table hidden" id="archived-leads-section">
                <h3 style="padding: 15px; color: #FFD700; border-bottom: 1px solid rgba(255, 215, 0, 0.2);">Archived Leads</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Company</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="archived-leads-body">
                        <!-- Archived leads will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Detail Modal -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lead Details</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modal-body">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        function login() {
            const password = document.getElementById('password').value;
            if (password === 'kingston2026') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadLeads();
            } else {
                alert('Incorrect password');
            }
        }
        
        async function loadLeads(forceRefresh = false) {
            const tbody = document.getElementById('leads-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;">Loading...</td></tr>';
            
            try {
                const cacheBuster = forceRefresh ? `?t=${Date.now()}` : '';
                const response = await fetch('/api/leads' + cacheBuster);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch leads');
                }
                
                const data = await response.json();
                const businesses = data.businesses || [];
                
                // Filter only leads from our forms
                let leads = businesses.filter(b => {
                    const source = b.columns?.find(c => c.title === 'Source')?.value || '';
                    return source.includes('OpenClaw') || source.includes('Free Build');
                });
                
                // Filter out archived leads
                leads = leads.filter(lead => !archivedLeads.includes(lead.id));
                
                // Update stats (filtered leads only)
                updateStats();
                
                // Render leads
                if (leads.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#888;">No leads yet</td></tr>';
                    return;
                }
                
                // Sort by date (newest first)
                leads.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                
                tbody.innerHTML = leads.map((lead, index) => {
                    const getCol = (title) => lead.columns?.find(c => c.title === title)?.value || '';
                    const date = new Date(lead.created_at).toLocaleDateString();
                    const isFreeBuild = lead.name?.includes('FREE BUILD');
                    const name = getCol('First Name') || getCol('Name') || 'Unknown';
                    
                    return `
                        <tr id="lead-${lead.id}">
                            <td>${date}</td>
                            <td><strong class="clickable-name" onclick="showLeadDetails(${index})">${name}</strong></td>
                            <td>${getCol('Email') || '-'}</td>
                            <td>${getCol('Phone') || '-'}</td>
                            <td>${getCol('Company') || '-'}</td>
                            <td><span class="badge ${isFreeBuild ? 'free-build' : ''}">${isFreeBuild ? 'FREE BUILD' : 'Ebook'}</span></td>
                            <td><button class="delete-btn" onclick="archiveLead('${lead.id}', '${name}')" title="Archive lead">🗑️</button></td>
                        </tr>
                    `;
                }).join('');
                
                // Store leads globally for modal access
                window.leadsData = leads;
                
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="error">Error loading leads: ${error.message}</td></tr>`;
            }
        }
        
        // Allow Enter key to login
        document.getElementById('password')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        
        // Archive functionality
        let archivedLeads = JSON.parse(localStorage.getItem('archivedLeads') || '[]');
        let showingArchive = false;
        
        function toggleArchiveView() {
            showingArchive = !showingArchive;
            const activeSection = document.getElementById('active-leads-section');
            const archivedSection = document.getElementById('archived-leads-section');
            const toggleBtn = document.getElementById('archive-toggle-btn');
            
            if (showingArchive) {
                activeSection.classList.add('hidden');
                archivedSection.classList.remove('hidden');
                toggleBtn.textContent = '👁️ View Active';
                renderArchivedLeads();
            } else {
                activeSection.classList.remove('hidden');
                archivedSection.classList.add('hidden');
                toggleBtn.textContent = '📁 View Archived';
                loadLeads(true);
            }
        }
        
        function archiveLead(id, name) {
            if (!confirm(`Archive "${name}"?\n\nThis will hide them from the active leads list.`)) {
                return;
            }
            
            // Add to archived list
            if (!archivedLeads.includes(id)) {
                archivedLeads.push(id);
                localStorage.setItem('archivedLeads', JSON.stringify(archivedLeads));
            }
            
            // Remove the row from the table
            const row = document.getElementById(`lead-${id}`);
            if (row) {
                row.style.transition = 'opacity 0.3s';
                row.style.opacity = '0';
                setTimeout(() => {
                    row.remove();
                    updateStats();
                }, 300);
            }
        }
        
        function unarchiveLead(id) {
            // Remove from archived list
            archivedLeads = archivedLeads.filter(leadId => leadId !== id);
            localStorage.setItem('archivedLeads', JSON.stringify(archivedLeads));
            
            // Remove the row from the archived table
            const row = document.getElementById(`archived-lead-${id}`);
            if (row) {
                row.style.transition = 'opacity 0.3s';
                row.style.opacity = '0';
                setTimeout(() => {
                    row.remove();
                    renderArchivedLeads();
                }, 300);
            }
        }
        
        function renderArchivedLeads() {
            const tbody = document.getElementById('archived-leads-body');
            
            if (archivedLeads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#888;">No archived leads</td></tr>';
                return;
            }
            
            // Filter the leads data to show only archived
            const archived = window.leadsData?.filter(lead => archivedLeads.includes(lead.id)) || [];
            
            if (archived.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#888;">No archived leads found</td></tr>';
                return;
            }
            
            tbody.innerHTML = archived.map((lead) => {
                const getCol = (title) => lead.columns?.find(c => c.title === title)?.value || '';
                const date = new Date(lead.created_at).toLocaleDateString();
                const isFreeBuild = lead.name?.includes('FREE BUILD');
                const name = getCol('First Name') || getCol('Name') || 'Unknown';
                
                return `
                    <tr id="archived-lead-${lead.id}">
                        <td>${date}</td>
                        <td><strong>${name}</strong></td>
                        <td>${getCol('Email') || '-'}</td>
                        <td>${getCol('Phone') || '-'}</td>
                        <td>${getCol('Company') || '-'}</td>
                        <td><span class="badge ${isFreeBuild ? 'free-build' : ''}">${isFreeBuild ? 'FREE BUILD' : 'Ebook'}</span></td>
                        <td><button class="delete-btn" onclick="unarchiveLead('${lead.id}')" title="Restore lead" style="color: #00FF41;">↩️ Restore</button></td>
                    </tr>
                `;
            }).join('');
        }
        
        function updateStats() {
            const visibleLeads = window.leadsData?.filter(lead => {
                const source = lead.columns?.find(c => c.title === 'Source')?.value || '';
                return (source.includes('OpenClaw') || source.includes('Free Build')) && !archivedLeads.includes(lead.id);
            }) || [];
            document.getElementById('total-leads').textContent = visibleLeads.length;
            document.getElementById('ebook-leads').textContent = visibleLeads.filter(l => {
                const source = l.columns?.find(c => c.title === 'Source')?.value || '';
                return source.includes('Guide Landing Page');
            }).length;
            document.getElementById('free-build-leads').textContent = visibleLeads.filter(l => {
                const source = l.columns?.find(c => c.title === 'Source')?.value || '';
                return source.includes('Free Build');
            }).length;
        }
        
        // Modal functions
        function showLeadDetails(index) {
            const lead = window.leadsData[index];
            if (!lead) return;
            
            const getCol = (title) => lead.columns?.find(c => c.title === title)?.value || '';
            const date = new Date(lead.created_at).toLocaleString();
            const isFreeBuild = lead.name?.includes('FREE BUILD');
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">Name</div>
                    <div class="detail-value">${getCol('First Name') || getCol('Name') || 'Unknown'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Email</div>
                    <div class="detail-value">${getCol('Email') || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Phone</div>
                    <div class="detail-value">${getCol('Phone') || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Company</div>
                    <div class="detail-value">${getCol('Company') || '-'}</div>
                </div>
                ${isFreeBuild ? `
                <div class="detail-row">
                    <div class="detail-label">Password</div>
                    <div class="detail-value" style="font-family: monospace; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px;">${getCol('Password') || '-'}</div>
                </div>
                ` : ''}
                <div class="detail-row">
                    <div class="detail-label">Notes / Business Problem</div>
                    <div class="detail-value">${getCol('Notes') || getCol('Business Problem') || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Source</div>
                    <div class="detail-value">${getCol('Source') || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Submitted</div>
                    <div class="detail-value">${date}</div>
                </div>
                <div class="detail-row" style="border-bottom: none;">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">${getCol('Status') || '-'}</div>
                </div>
            `;
            
            document.getElementById('detail-modal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('detail-modal').classList.remove('show');
        }
        
        // Close modal when clicking outside
        document.getElementById('detail-modal')?.addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') closeModal();
        });
        
        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
